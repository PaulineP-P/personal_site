<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вне сети · дневник</title>
<meta name="theme-color" content="#5c1a26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1ec; --paper:#fffaf6; --blush:#f1dfdf; --blush2:#e8cfd1;
  --wine:#5c1a26; --wine2:#7a2433; --ink:#2a1a1d; --muted:#8a7276; --line:#e6d6d4;
  --ok:#6f7d5a; --warn:#b5743c; --late:#a33a48; --glass:rgba(255,250,246,.78);
  --shadow:0 1px 2px rgba(60,20,30,.06),0 8px 24px rgba(60,20,30,.06);
  --seal:#5c1a26; --seal-fg:#fbefe9;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140d0f; --paper:#1f1417; --blush:#2b1a1e; --blush2:#3a2227;
  --wine:#e3b7bd; --wine2:#f0cdd2; --ink:#f3e8e6; --muted:#a8918f; --line:#3a2a2d;
  --ok:#a8b88c; --warn:#e0a46e; --late:#ef8d99; --glass:rgba(31,20,23,.82);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#140d0f; --paper:#1f1417; --blush:#2b1a1e; --blush2:#3a2227;
  --wine:#e3b7bd; --wine2:#f0cdd2; --ink:#f3e8e6; --muted:#a8918f; --line:#3a2a2d;
  --ok:#a8b88c; --warn:#e0a46e; --late:#ef8d99; --glass:rgba(31,20,23,.82);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--wine)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;border-right:1px solid var(--line);background:var(--paper)}
.brand{font:italic 500 30px/1 var(--serif);color:var(--wine);margin:0 6px 2px}
.brand-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 6px 22px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px}
nav a:hover{background:var(--blush)}
nav a.on{background:var(--wine);color:var(--paper)}
nav .grp{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
main{padding:32px clamp(16px,4vw,48px) 96px;max-width:1120px;width:100%}
.kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{font:italic 500 clamp(30px,4vw,42px)/1.1 var(--serif);color:var(--wine);margin:4px 0 18px}
h2{font:500 24px/1.2 var(--serif);color:var(--wine);margin:0 0 12px}
h3{font:600 15px/1.3 var(--sans);margin:0 0 6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.blush{background:var(--blush)}
.card.wine{background:var(--seal);color:var(--seal-fg);border-color:transparent}
.card.wine .kicker{color:color-mix(in srgb,var(--seal-fg) 70%,transparent)}
.card.wine h2,.card.wine .big{color:var(--seal-fg)}
.card.wine .bar{background:color-mix(in srgb,var(--seal-fg) 25%,transparent)}
.card.wine .bar>i{background:var(--seal-fg)}
.letter{position:relative;background:var(--seal);color:var(--seal-fg);border-radius:18px;padding:22px 24px;overflow:hidden}
.letter .grid-bg{position:absolute;inset:0;font:12px/1.9 var(--serif);letter-spacing:.9em;opacity:.08;word-break:break-all;padding:10px;pointer-events:none}
.letter .msg{position:relative;font:italic 400 clamp(20px,2.6vw,27px)/1.3 var(--serif)}
.letter .from{position:relative;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.notif{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.notif .ic{width:26px;height:26px;border-radius:7px;background:var(--seal);flex:none;display:grid;place-items:center;color:var(--seal-fg);font-size:12px}
.notif .t{font-weight:600;font-size:13px}
.notif .s{font-size:12.5px;color:var(--muted)}
.notif .when{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--wine);background:var(--wine);color:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--wine)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.link{border:none;background:none;color:var(--muted);padding:2px 6px}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--wine2);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blush);color:var(--ink);white-space:nowrap}
.chip.late{background:color-mix(in srgb,var(--late) 18%,transparent);color:var(--late)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.bar{height:6px;border-radius:9px;background:var(--blush2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--wine);border-radius:9px}
.bar.time>i{background:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.big{font:500 34px/1 var(--serif);color:var(--wine)}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:none}
.cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--wine);display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;padding:0}
.cb.on{background:var(--wine);color:var(--paper)}
.cb.on::after{content:'✓';font-size:13px}
.done-text{text-decoration:line-through;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--blush2)}
.heat i.on{background:var(--wine)}
.heat i.min{background:color-mix(in srgb,var(--wine) 45%,var(--blush2))}
.goal{border-left:3px solid var(--wine)}
.steps .check{padding:4px 0;font-size:13.5px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto}
.kan .col{background:var(--blush);border-radius:12px;padding:10px;min-height:80px}
.kan .it{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;font-size:13px}
.flash{min-height:160px;display:grid;place-items:center;text-align:center;cursor:pointer;font:italic 500 28px/1.2 var(--serif);color:var(--wine)}
.seal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--seal);color:var(--seal-fg);font:italic 600 22px/1 var(--serif);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--paper) 25%,transparent)}
.seal.off{background:var(--blush2);color:var(--muted);box-shadow:none}
.banner{background:var(--blush);border:1px dashed var(--wine);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.timer{position:fixed;right:18px;bottom:18px;z-index:20}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,12,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--wine);color:var(--paper);border-color:var(--wine)}
.mob-nav{display:none}
.empty{color:var(--muted);font-style:italic;font-family:var(--serif);font-size:17px}
svg text{fill:var(--muted);font:11px var(--sans)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .g2,.g3{grid-template-columns:1fr}
  main{padding:20px 16px 96px}
  .mob-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:30}
  .mob-nav a{text-decoration:none;color:var(--muted);font-size:11px;text-align:center;flex:1}
  .mob-nav a.on{color:var(--wine);font-weight:600}
  .timer{bottom:78px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">вне сети</div>
    <div class="brand-sub">дневник · трекер · письма себе</div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="mob-nav" id="mobnav"></div>
<div id="timer" class="timer"></div>
<div id="modal"></div>

<script>
/* ============ storage ============ */
const KEY='vneseti.v1';
const AREAS=[
 {id:'asp',name:'Аспирантура',c:'#5c1a26'},
 {id:'art',name:'Статьи',c:'#8c3b4a'},
 {id:'eng',name:'Английский',c:'#b0646f'},
 {id:'lt',name:'Лингвотест',c:'#c98b8f'},
 {id:'ch',name:'Канал',c:'#7d5a63'},
 {id:'book',name:'Книга',c:'#3d1218'},
 {id:'life',name:'Другое',c:'#9a8a86'}];
const A=id=>AREAS.find(a=>a.id===id)||AREAS[6];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fd=s=>{if(!s)return '';const d=new Date(s+'T12:00');return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const hm=m=>{m=Math.round(m||0);const h=Math.floor(m/60);return h?h+' ч '+(m%60?m%60+' мин':''):m+' мин'};

function seed(){
 const t=today();
 return {v:1,
  settings:{name:'Полина',why:'Я пишу, учусь и исследую, потому что хочу жить свою жизнь, а не откладывать её. Каждое маленькое действие — письмо будущей себе.',examDate:'2027-02-20',bookGoal:80000,dailyWords:300,lastBackup:null,theme:'auto'},
  goals:[
   {id:uid(),area:'lt',title:'Сдать «Лингвотест» (академическая версия)',deadline:'2027-02-20',target:0,unit:'',progress:0,created:t,done:false,steps:[
     {id:uid(),t:'Зарегистрироваться на сессию и вписать дату',done:false},{id:uid(),t:'Диагностика: пробный тест по всем 5 блокам',done:false},{id:uid(),t:'План тренировки слабых блоков',done:false},{id:uid(),t:'3 полных пробных теста в формате экзамена',done:false}]},
   {id:uid(),area:'art',title:'Доклад на ICAISET 2026 (МФТИ)',deadline:'2026-12-01',target:0,unit:'',progress:0,created:t,done:false,steps:[
     {id:uid(),t:'Решение о тезисах (до 14 ноября)',done:false},{id:uid(),t:'Слайды 8–10 шт.',done:false},{id:uid(),t:'Прогон доклада вслух',done:false}]},
   {id:uid(),area:'asp',title:'Выбрать аспирантуру и научного руководителя',deadline:'2027-03-01',target:0,unit:'',progress:0,created:t,done:false,steps:[
     {id:uid(),t:'Список программ и сроки приёма',done:false},{id:uid(),t:'Письмо потенциальному руководителю',done:false},{id:uid(),t:'Набросок темы диссертации',done:false}]},
   {id:uid(),area:'book',title:'Первый черновик романа',deadline:'2027-06-30',target:80000,unit:'слов',progress:0,created:t,done:false,steps:[]},
   {id:uid(),area:'ch',title:'Вернуть ритм канала: 1 пост в неделю',deadline:'2026-12-31',target:8,unit:'постов',progress:0,created:t,done:false,steps:[]}],
  habits:[
   {id:uid(),name:'Английский',min:'хотя бы 5 минут слов или подкаст',area:'eng'},
   {id:uid(),name:'Книга',min:'хотя бы один абзац',area:'book'},
   {id:uid(),name:'Наука / статья',min:'15 минут над текстом',area:'art'},
   {id:uid(),name:'Канал',min:'записать одну идею поста',area:'ch'}],
  checks:{}, mins:{}, todayTasks:{date:t,items:[]}, time:[], timer:null, ideas:[], reviews:[],
  lists:{
   vocab:[],chapters:[],characters:[],world:[],phrases:[],words:[],content:[],chstats:[],lit:[],mocks:[],ltweak:[],
   conferences:[
    {id:uid(),name:'ICAISET 2026 (МФТИ)',date:'2026-12-01',deadline:'2026-11-01',pub:'уточнить',status:'подано',link:'http://nwcc-conference.com'},
    {id:uid(),name:'«Технологии ИИ в науке и образовании» (Ломоносов, МГУ)',date:'',deadline:'',pub:'сборник с DOI',status:'идея',link:'https://conf.msu.ru'},
    {id:uid(),name:'ИИ и цифровые ресурсы в образовании (МПГУ)',date:'',deadline:'',pub:'РИНЦ',status:'идея',link:'https://mpgu.su'},
    {id:uid(),name:'Ясинская (Апрельская) конференция ВШЭ',date:'',deadline:'',pub:'',status:'идея',link:'https://www.hse.ru'},
    {id:uid(),name:'BEA 2027 (ACL workshop)',date:'',deadline:'',pub:'ACL Anthology',status:'идея',link:'https://aclweb.org'}],
   articles:[{id:uid(),title:'LLM-оценивание DELF B2 (23 работы)',venue:'ICAISET 2026',status:'отправлено',deadline:'2026-11-01'}],
   checklist:[
    {id:uid(),item:'Выбрать 2–3 аспирантские программы',done:false,date:''},
    {id:uid(),item:'Узнать сроки приёма и вступительные экзамены',done:false,date:''},
    {id:uid(),item:'Собрать портфолио: публикации, доклады, награды',done:false,date:''},
    {id:uid(),item:'Подготовить реферат / исследовательское предложение',done:false,date:''},
    {id:uid(),item:'Сертификат по английскому (Лингвотест)',done:false,date:''}],
   ltblocks:[
    {id:uid(),block:'Чтение',target:'',current:''},{id:uid(),block:'Аудирование',target:'',current:''},
    {id:uid(),block:'Письмо',target:'',current:''},{id:uid(),block:'Говорение',target:'',current:''},
    {id:uid(),block:'Лексика и грамматика',target:'',current:''}]
  }};
}
let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
 const base=seed();for(const k in base)if(S[k]===undefined)S[k]=base[k];
 for(const k in base.lists)if(!S.lists[k])S.lists[k]=base.lists[k];
 for(const k in base.settings)if(S.settings[k]===undefined)S.settings[k]=base.settings[k];}
let saveFailed=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}catch(e){saveFailed=true}}
load();

/* ============ theme ============ */
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
applyTheme();

/* ============ derived ============ */
function streak(){let n=0,d=today();if(!(S.checks[d]||[]).length)d=addDays(d,-1);
 while((S.checks[d]||[]).length){n++;d=addDays(d,-1)}return n}
function habitStreak(id){let n=0,d=today();if(!(S.checks[d]||[]).includes(id))d=addDays(d,-1);
 while((S.checks[d]||[]).includes(id)){n++;d=addDays(d,-1)}return n}
function bestStreak(){const days=Object.keys(S.checks).filter(d=>S.checks[d].length).sort();let best=0,cur=0,prev=null;
 for(const d of days){cur=(prev&&diffDays(prev,d)===1)?cur+1:1;best=Math.max(best,cur);prev=d}return best}
const totalChecks=()=>Object.values(S.checks).reduce((a,v)=>a+v.length,0);
const minutes=(f=()=>true)=>S.time.filter(f).reduce((a,t)=>a+(+t.min||0),0);
const weekStart=()=>{const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d)};
const inWeek=t=>t.date>=weekStart();
const inMonth=t=>t.date.slice(0,7)===today().slice(0,7);
const bookWords=()=>S.lists.words.reduce((a,w)=>a+(+w.words||0),0);
function goalPct(g){if(g.done)return 100;if(g.target>0)return Math.min(100,Math.round(100*(g.progress||0)/g.target));
 if(g.steps.length)return Math.round(100*g.steps.filter(s=>s.done).length/g.steps.length);return 0}
function points(){
 const steps=S.goals.reduce((a,g)=>a+g.steps.filter(s=>s.done).length,0);
 return totalChecks()*10+Math.round(minutes()/3)+steps*10+S.goals.filter(g=>g.done).length*100+S.ideas.length*2+S.reviews.length*40+Math.round(bookWords()/50)+S.lists.vocab.length*3+S.lists.content.filter(c=>c.status==='опубликовано').length*20+S.lists.mocks.length*15}
const LEVELS=[['Черновик',0],['Первое письмо',200],['Переписка',600],['Постоянный автор',1500],['Исследователь',3000],['Автор романа',6000],['Почётный корреспондент',10000]];
function level(){const p=points();let i=0;LEVELS.forEach((l,k)=>{if(p>=l[1])i=k});const next=LEVELS[i+1];
 return {name:LEVELS[i][0],i,p,next,pct:next?Math.round(100*(p-LEVELS[i][1])/(next[1]-LEVELS[i][1])):100}}
function seals(){const st=bestStreak(),m=minutes();return [
 ['I','Первое письмо','Отметить первую привычку',totalChecks()>=1],
 ['7','Неделя без пропусков','Серия 7 дней',st>=7],
 ['30','Месяц ритма','Серия 30 дней',st>=30],
 ['10ч','Десять часов','10 часов в учёте времени',m>=600],
 ['50ч','Пятьдесят часов','50 часов в учёте времени',m>=3000],
 ['✓','Первая цель','Закрыть первую цель',S.goals.some(g=>g.done)],
 ['V','Пять целей','Закрыть 5 целей',S.goals.filter(g=>g.done).length>=5],
 ['1k','Тысяча слов','1 000 слов книги',bookWords()>=1000],
 ['10k','Десять тысяч','10 000 слов книги',bookWords()>=10000],
 ['Aa','Сто слов','100 английских слов в словаре',S.lists.vocab.length>=100],
 ['RE','Письмо себе','Первый обзор недели',S.reviews.length>=1],
 ['IV','Месяц обзоров','4 обзора недели',S.reviews.length>=4],

/* ============ modal & generic form ============ */
let modalSave=null;
function openForm(title,fields,data,onSave,extra=''){
 modalSave=onSave;
 let h=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2><form id="mf" onsubmit="event.preventDefault();submitForm()">`;
 fields.forEach(f=>{const v=data?.[f.k]??f.def??'';h+=`<label class="f" for="f_${f.k}">${esc(f.label)}</label>`;
  if(f.type==='textarea')h+=`<textarea id="f_${f.k}" name="${f.k}">${esc(v)}</textarea>`;
  else if(f.type==='select')h+=`<select id="f_${f.k}" name="${f.k}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.type==='check')h+=`<input type="checkbox" id="f_${f.k}" name="${f.k}" ${v?'checked':''}>`;
  else h+=`<input type="${f.type||'text'}" id="f_${f.k}" name="${f.k}" value="${esc(v)}" ${f.req?'required':''} ${f.type==='number'?'step="any"':''}>`;});
 h+=extra+`<div class="row" style="margin-top:18px;justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn">Сохранить</button></div></form></div></div>`;
 document.getElementById('modal').innerHTML=h;
 setTimeout(()=>document.querySelector('#mf input,#mf textarea,#mf select')?.focus(),30)}
function submitForm(){const f=document.getElementById('mf');const o={};
 [...f.elements].forEach(el=>{if(!el.name)return;o[el.name]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':+el.value):el.value.trim()});
 modalSave(o);closeModal();save();render()}
function closeModal(){document.getElementById('modal').innerHTML=''}

/* ============ deadlines & goals ============ */
function dlChip(dl){if(!dl)return '<span class="chip">без дедлайна</span>';const d=diffDays(today(),dl);
 if(d<0)return `<span class="chip late">просрочено на ${-d} дн.</span>`;if(d===0)return `<span class="chip warn">сегодня</span>`;
 if(d<=7)return `<span class="chip warn">осталось ${d} дн.</span>`;return `<span class="chip">осталось ${d} дн.</span>`}
function goalCard(g,compact){const pct=goalPct(g);const spent=minutes(t=>t.goal===g.id),wk=minutes(t=>t.goal===g.id&&inWeek(t));
 let tl='';if(g.deadline&&g.created&&!g.done){const tot=Math.max(1,diffDays(g.created,g.deadline)),gone=Math.min(tot,Math.max(0,diffDays(g.created,today())));const tp=Math.round(100*gone/tot);
  tl=`<div class="row small muted" style="margin-top:8px;gap:6px"><span style="width:100px">прошло дней</span><div class="bar time" style="flex:1"><i style="width:${tp}%"></i></div><span>${tp}%</span></div>`;
  if(tp-pct>=25&&tp>20)tl+=`<div class="small" style="color:var(--warn);margin-top:4px">Время идёт быстрее прогресса — выбери один шаг на 15 минут сегодня.</div>`}
 let h=`<div class="card goal" style="border-left-color:${A(g.area).c}"><div class="row between"><span class="kicker">${A(g.area).name}</span>${g.done?'<span class="chip ok">готово</span>':dlChip(g.deadline)}</div>
 <h3 style="margin-top:6px;font:500 20px/1.25 var(--serif)" class="${g.done?'done-text':''}">${esc(g.title)}</h3>
 <div class="row small muted" style="gap:6px"><span style="width:100px">сделано</span><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>${tl}
 <div class="row small" style="margin-top:8px;gap:14px"><span>⏱ всего <b>${hm(spent)}</b></span><span class="muted">за неделю ${hm(wk)}</span>${g.deadline?`<span class="muted">до ${fd(g.deadline)}</span>`:''}${g.target>0?`<span class="muted">${g.progress||0} / ${g.target} ${esc(g.unit)}</span>`:''}</div>`;
 if(!compact&&g.steps.length){h+='<div class="steps" style="margin-top:10px">';g.steps.forEach(s=>h+=`<div class="check"><button class="cb ${s.done?'on':''}" aria-label="шаг" onclick="toggleStep('${g.id}','${s.id}')"></button><span class="${s.done?'done-text':''}">${esc(s.t)}</span></div>`);h+='</div>'}
 h+=`<div class="row" style="margin-top:12px;gap:6px"><button class="btn sm" onclick="startTimer('${g.id}')">▶ таймер</button><button class="btn sm ghost" onclick="addTime('${g.id}')">+ время</button>${g.target>0?`<button class="btn sm ghost" onclick="addProgress('${g.id}')">+ прогресс</button>`:''}<button class="btn sm ghost" onclick="editGoal('${g.id}')">изменить</button>${g.done?'':`<button class="btn sm link" onclick="finishGoal('${g.id}')">закрыть цель</button>`}</div></div>`;
 return h}
function editGoal(id,area){const g=id?S.goals.find(x=>x.id===id):null;
 openForm(g?'Изменить цель':'Новая цель',[
  {k:'title',label:'Цель',req:1},{k:'area',label:'Раздел',type:'select',opts:AREAS.map(a=>[a.id,a.name]),def:area||'life'},
  {k:'deadline',label:'Дедлайн',type:'date'},{k:'target',label:'Числовая цель (необязательно: слов, постов, часов…)',type:'number'},{k:'unit',label:'Единица (слов, постов…)'},
  {k:'stepsText',label:'Шаги — каждый с новой строки',type:'textarea'}],
  g?{...g,stepsText:g.steps.map(s=>s.t).join('\n')}:null,
  o=>{const lines=(o.stepsText||'').split('\n').map(s=>s.trim()).filter(Boolean);delete o.stepsText;o.target=+o.target||0;
   if(g){const old=g.steps;g.steps=lines.map(t=>old.find(s=>s.t===t)||{id:uid(),t,done:false});Object.assign(g,o)}
   else S.goals.push({id:uid(),progress:0,created:today(),done:false,...o,steps:lines.map(t=>({id:uid(),t,done:false}))})},
  g?`<p class="small" style="margin-top:12px"><button type="button" class="btn link" style="color:var(--late)" onclick="delGoal('${g.id}')">удалить цель</button></p>`:'')}

function startTimer(goalId,area){if(S.timer&&!confirm('Таймер уже идёт. Остановить его и запустить новый?'))return;if(S.timer)stopTimer(true);

function stopTimer(silent){const t=S.timer;if(!t)return;const min=Math.max(1,Math.round((Date.now()-t.start)/60000));
 S.time.push({id:uid(),goal:t.goal,area:t.area,min,date:today(),note:'таймер'});S.timer=null;save();if(!silent){render();toast('Записано: '+hm(min))}}

  {k:'goal',label:'Цель',type:'select',opts:[['','— без цели —'],...S.goals.filter(x=>!x.done).map(x=>[x.id,x.title])],def:goalId||''},

function bars(data,{h=130,fmt=v=>v}={}){const max=Math.max(1,...data.map(d=>d.v));
 return `<div style="display:flex;align-items:flex-end;gap:4px;height:${h}px;padding-top:6px" role="img" aria-label="столбчатый график">${data.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0" title="${esc(d.l)}: ${esc(fmt(d.v))}"><div style="width:70%;max-width:28px;height:${Math.max(d.v?3:0,(d.v/max)*(h-22))}px;background:${d.c||'var(--wine)'};border-radius:5px 5px 2px 2px"></div><div class="small muted" style="font-size:10.5px;margin-top:4px">${esc(d.l)}</div></div>`).join('')}</div>`}
function line(points,{h=110}={}){if(points.length<2)return '<p class="empty">Нужно хотя бы две записи для графика.</p>';
 const ys=points.map(p=>p.v),mn=Math.min(...ys),mx=Math.max(...ys),r=mx-mn||1;const W=300;
 const pts=points.map((p,i)=>[10+i*(W-20)/(points.length-1),h-14-((p.v-mn)/r)*(h-34)]);
 return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px" role="img" aria-label="динамика"><polyline fill="none" stroke="var(--wine)" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--wine)"><title>${fd(points[i].l)}: ${points[i].v}</title></circle>`).join('')}<text x="10" y="${h-2}">${fd(points[0].l)}</text><text x="${W-10}" y="${h-2}" text-anchor="end">${fd(points.at(-1).l)}</text><text x="${W-10}" y="12" text-anchor="end">${mx}</text></svg>`}

/* ============ pages ============ */
const LETTERS='ЖЮЗФАЩПЛПУЬЖСЗХПРОСТИКРАЦВПХИОТЯЬЧИТЫГДЕЛВЕРНУСЬЩСКАВУЩГНГЭПРИЕЗЖАЙКНВОБНИМАЮАЭЦАЖЖЯЯБРНЧНОВУЖЩЦИЛВКЛСПАСИБОАОВСТРЕТИМСЯЩЯГ';
function greet(){const hr=new Date().getHours();return hr<6?'доброй ночи':hr<12?'доброе утро':hr<18?'добрый день':'добрый вечер'}
function pToday(){const t=today();if(S.todayTasks.date!==t)S.todayTasks={date:t,items:S.todayTasks.items.filter(i=>!i.done)};
 const lv=level(),st=streak();const dn=new Date();
 const upcoming=S.goals.filter(g=>!g.done&&g.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,4);
 const confs=S.lists.conferences.filter(c=>c.deadline&&c.deadline>=t&&['идея','готовлю'].includes(c.status)).slice(0,3);
 const done=(S.checks[t]||[]);
 let h=`<div class="kicker">${dn.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})} · вне сети</div><h1>${greet()}, ${esc(S.settings.name)}</h1>
 <div class="letter"><div class="grid-bg">${LETTERS.repeat(6)}</div><div class="from">новое сообщение для тебя · от той, кем ты становишься</div><div class="msg">${esc(S.settings.why)}</div></div>
 <div class="grid g3" style="margin-top:16px">
  <div class="card"><div class="kicker">серия дней</div><div class="big">${st}</div><div class="small muted">лучшая — ${bestStreak()}</div></div>
  <div class="card"><div class="kicker">уровень</div><div style="font:italic 500 22px/1.2 var(--serif);color:var(--wine)">${lv.name}</div><div class="bar" style="margin-top:8px"><i style="width:${lv.pct}%"></i></div><div class="small muted" style="margin-top:4px">${lv.p} очков${lv.next?' · до «'+lv.next[0]+'» '+(lv.next[1]-lv.p):''}</div></div>
  <div class="card"><div class="kicker">время за неделю</div><div class="big">${hm(minutes(inWeek))}</div><div class="small muted">сегодня ${hm(minutes(x=>x.date===t))}</div></div>
 </div>
 <div class="grid g2" style="margin-top:16px">
  <div class="card"><div class="row between"><h2 style="margin:0">Привычки дня</h2><a class="small" href="#habits">все</a></div>`;
 S.habits.forEach(hb=>{const on=done.includes(hb.id);const yest=(S.checks[addDays(t,-1)]||[]).includes(hb.id);
  h+=`<div class="check"><button class="cb ${on?'on':''}" aria-label="${esc(hb.name)}" onclick="toggleHabit('${hb.id}')"></button><div style="flex:1"><div class="${on?'done-text':''}">${esc(hb.name)}</div><div class="small muted">минимум: ${esc(hb.min)}</div></div>${!on&&!yest&&Object.entries(S.checks).some(([d,v])=>d<addDays(t,-1)&&v.includes(hb.id))?'<span class="chip warn">не пропускай дважды</span>':''}${habitStreak(hb.id)>1?`<span class="chip">${habitStreak(hb.id)} дн.</span>`:''}</div>`});
 if(!S.habits.length)h+='<p class="empty">Добавь первую привычку на странице «Привычки».</p>';
 h+=`</div><div class="card"><h2>Три главных дела</h2>`;
 S.todayTasks.items.forEach((it,i)=>h+=`<div class="check"><button class="cb ${it.done?'on':''}" aria-label="дело" onclick="toggleTask(${i})"></button><span style="flex:1" class="${it.done?'done-text':''}">${esc(it.t)}</span><button class="btn link" onclick="delTask(${i})">×</button></div>`);
 if(S.todayTasks.items.length<3)h+=`<form class="row" style="margin-top:8px" onsubmit="event.preventDefault();addTask(this.t.value);"><input type="text" name="t" placeholder="маленький шаг на сегодня…" aria-label="новое дело" style="flex:1"><button class="btn sm">+</button></form>`;
 h+=`<form class="row" style="margin-top:16px" onsubmit="event.preventDefault();quickIdea(this.t.value)"><input type="text" name="t" placeholder="быстрая идея — запиши, пока не улетела" aria-label="быстрая идея" style="flex:1"><button class="btn sm ghost">в идеи</button></form></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card blush"><h2>Ближайшие дедлайны</h2><div class="grid" style="gap:8px">`;
 upcoming.forEach(g=>h+=`<div class="notif"><div class="ic" style="background:${A(g.area).c}">${A(g.area).name[0]}</div><div style="min-width:0"><div class="t">${esc(g.title)}</div><div class="s">${goalPct(g)}% · ${hm(minutes(x=>x.goal===g.id))} вложено</div></div><span class="when">${dlChip(g.deadline)}</span></div>`);
 confs.forEach(c=>h+=`<div class="notif"><div class="ic">§</div><div><div class="t">${esc(c.name)}</div><div class="s">подача</div></div><span class="when">${dlChip(c.deadline)}</span></div>`);
 if(!upcoming.length&&!confs.length)h+='<p class="empty">Дедлайнов нет — самое время поставить цель.</p>';
 h+=`</div></div><div class="card"><h2>Начать сейчас</h2><p class="small muted">Не нужно настроение — нужно 15 минут. Запусти таймер на любую цель.</p><div class="grid" style="gap:8px">`;
 S.goals.filter(g=>!g.done).slice(0,5).forEach(g=>h+=`<div class="row between"><span class="small" style="flex:1;min-width:0">${esc(g.title)}</span><button class="btn sm" onclick="startTimer('${g.id}')">▶</button></div>`);
 return h+`</div></div></div>`}
function toggleHabit(id){const t=today();const a=S.checks[t]||(S.checks[t]=[]);const i=a.indexOf(id);if(i>=0)a.splice(i,1);else{a.push(id);if(streak()%7===0)toast('Ещё неделя ритма. Ты — человек, который возвращается.')}save();render()}
function addTask(v){v=v.trim();if(!v)return;S.todayTasks.items.push({t:v,done:false});save();render()}
function toggleTask(i){S.todayTasks.items[i].done=!S.todayTasks.items[i].done;save();render()}
function delTask(i){S.todayTasks.items.splice(i,1);save();render()}
function quickIdea(v){v=v.trim();if(!v)return;S.ideas.unshift({id:uid(),text:v,area:'',date:today()});save();render();toast('Идея сохранена во входящих')}

function pGoals(){let tab=window._gt||'active';const gs=S.goals.filter(g=>tab==='done'?g.done:!g.done).sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'));
 let h=`<div class="kicker">каждой цели — свой срок</div><h1>Цели и дедлайны</h1><div class="row between"><div class="tabs"><button class="${tab==='active'?'on':''}" onclick="window._gt='active';render()">в работе (${S.goals.filter(g=>!g.done).length})</button><button class="${tab==='done'?'on':''}" onclick="window._gt='done';render()">закрытые (${S.goals.filter(g=>g.done).length})</button></div><button class="btn" onclick="editGoal()">+ новая цель</button></div>`;
 h+=`<div class="grid g2">${gs.map(g=>goalCard(g)).join('')||'<p class="empty">Здесь пока ничего нет.</p>'}</div>`;return h}

function pHabits(){const t=today();let h=`<div class="kicker">не идеально — регулярно</div><h1>Привычки</h1><div class="row between" style="margin-bottom:12px"><p class="muted small" style="margin:0;max-width:560px">Правило: можно пропустить один день, но не два подряд. В тяжёлый день выполняй «минимум» — он тоже засчитывается.</p><button class="btn" onclick="editHabit()">+ привычка</button></div><div class="grid g2">`;
 S.habits.forEach(hb=>{const on=(S.checks[t]||[]).includes(hb.id);let cells='';const start=addDays(t,-7*15+1-((new Date().getDay()+6)%7));
  for(let i=0;i<7*16;i++){const d=addDays(start,i);if(d>t){cells+='<i style="opacity:0"></i>';continue}cells+=`<i class="${(S.checks[d]||[]).includes(hb.id)?'on':''}" title="${fd(d)}"></i>`}
  const cnt=Object.values(S.checks).filter(v=>v.includes(hb.id)).length;
  h+=`<div class="card"><div class="row between"><div><span class="kicker">${A(hb.area).name}</span><h3 style="font:500 21px/1.2 var(--serif);margin:2px 0">${esc(hb.name)}</h3><div class="small muted">минимум: ${esc(hb.min)}</div></div><button class="cb ${on?'on':''}" style="width:34px;height:34px" aria-label="отметить сегодня" onclick="toggleHabit('${hb.id}')"></button></div>
  <div style="overflow-x:auto;margin:12px 0"><div class="heat">${cells}</div></div>
  <div class="row small" style="gap:14px"><span>серия <b>${habitStreak(hb.id)}</b></span><span class="muted">всего отметок ${cnt}</span><span style="margin-left:auto"><button class="btn link" onclick="markYesterday('${hb.id}')">отметить вчера</button><button class="btn link" onclick="editHabit('${hb.id}')">изм.</button></span></div></div>`});
 return h+'</div>'}
function markYesterday(id){const d=addDays(today(),-1);const a=S.checks[d]||(S.checks[d]=[]);if(!a.includes(id))a.push(id);else a.splice(a.indexOf(id),1);save();render()}
function editHabit(id){const hb=id?S.habits.find(x=>x.id===id):null;
 openForm(hb?'Изменить привычку':'Новая привычка',[{k:'name',label:'Привычка',req:1},{k:'min',label:'Минимальная версия (для тяжёлых дней)'},{k:'area',label:'Раздел',type:'select',opts:AREAS.map(a=>[a.id,a.name])}],hb,
 o=>{if(hb)Object.assign(hb,o);else S.habits.push({id:uid(),...o})},hb?`<p class="small" style="margin-top:12px"><button type="button" class="btn link" style="color:var(--late)" onclick="if(confirm('Удалить привычку?')){S.habits=S.habits.filter(x=>x.id!=='${hb.id}');closeModal();save();render()}">удалить привычку</button></p>`:'')}

function pTime(){const t=today();const days=[...Array(14)].map((_,i)=>addDays(t,i-13));
 const byArea=AREAS.map(a=>({l:a.name,v:minutes(x=>x.area===a.id&&inWeek(x)),m:minutes(x=>x.area===a.id&&inMonth(x)),all:minutes(x=>x.area===a.id),c:a.c}));
 let h=`<div class="kicker">куда уходит моё время</div><h1>Учёт времени</h1><div class="row" style="margin-bottom:16px"><button class="btn" onclick="addTime()">+ учесть время</button>${S.timer?'':`<button class="btn ghost" onclick="pickTimer()">▶ запустить таймер</button>`}</div>
 <div class="grid g3"><div class="card"><div class="kicker">сегодня</div><div class="big">${hm(minutes(x=>x.date===t))}</div></div><div class="card"><div class="kicker">эта неделя</div><div class="big">${hm(minutes(inWeek))}</div></div><div class="card"><div class="kicker">этот месяц</div><div class="big">${hm(minutes(inMonth))}</div></div></div>
 <div class="card" style="margin-top:16px"><h2>Последние 14 дней</h2>${bars(days.map(d=>({l:String(new Date(d+'T12:00').getDate()),v:minutes(x=>x.date===d)})),{fmt:hm})}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>По разделам</h2><div class="tbl"><table><thead><tr><th>раздел</th><th>неделя</th><th>месяц</th><th>всего</th></tr></thead><tbody>${byArea.map(a=>`<tr><td><span class="dot" style="background:${a.c};display:inline-block;margin-right:6px"></span>${a.l}</td><td>${hm(a.v)}</td><td>${hm(a.m)}</td><td>${hm(a.all)}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h2>По целям</h2><div class="tbl"><table><thead><tr><th>цель</th><th>неделя</th><th>всего</th><th>дедлайн</th></tr></thead><tbody>${S.goals.map(g=>({g,all:minutes(x=>x.goal===g.id),w:minutes(x=>x.goal===g.id&&inWeek(x))})).sort((a,b)=>b.all-a.all).map(r=>`<tr><td>${esc(r.g.title)}</td><td>${hm(r.w)}</td><td><b>${hm(r.all)}</b></td><td>${r.g.done?'<span class="chip ok">готово</span>':dlChip(r.g.deadline)}</td></tr>`).join('')}</tbody></table></div></div></div>
 <div class="card" style="margin-top:16px"><h2>Журнал</h2>`;
 const rows=[...S.time].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
 if(!rows.length)h+='<p class="empty">Первая запись появится, когда ты запустишь таймер или учтёшь время вручную.</p>';
 else h+=`<div class="tbl"><table><thead><tr><th>дата</th><th>раздел / цель</th><th>время</th><th>что делала</th><th></th></tr></thead><tbody>${rows.map(r=>{const g=r.goal&&S.goals.find(x=>x.id===r.goal);return `<tr><td>${fd(r.date)}</td><td>${esc(g?g.title:A(r.area).name)}</td><td>${hm(r.min)}</td><td class="muted">${esc(r.note)}</td><td><button class="btn link" onclick="delTime('${r.id}')">×</button></td></tr>`}).join('')}</tbody></table></div>`;
 return h+'</div>'}
function pickTimer(){openForm('Запустить таймер',[{k:'goal',label:'На что',type:'select',opts:[['','— без цели —'],...S.goals.filter(x=>!x.done).map(x=>[x.id,x.title])]},{k:'area',label:'Раздел (если без цели)',type:'select',opts:AREAS.map(a=>[a.id,a.name])}],null,o=>{S.timer={goal:o.goal||null,area:o.goal?S.goals.find(g=>g.id===o.goal).area:o.area,start:Date.now()}})}

function pIdeas(){const f=window._if||'all';const list=S.ideas.filter(i=>f==='all'?true:f==='inbox'?!i.area:i.area===f);
 let h=`<div class="kicker">ничего не теряется</div><h1>Идеи</h1><form class="row" style="margin-bottom:14px" onsubmit="event.preventDefault();quickIdea(this.t.value)"><input type="text" name="t" placeholder="новая идея…" aria-label="новая идея" style="flex:1"><button class="btn">записать</button></form>
 <div class="tabs">${[['all','все'],['inbox','входящие'],...AREAS.map(a=>[a.id,a.name])].map(([id,n])=>`<button class="${f===id?'on':''}" onclick="window._if='${id}';render()">${n}</button>`).join('')}</div><div class="grid g2">`;
 list.forEach(i=>h+=`<div class="card"><div class="row between"><span class="kicker">${i.area?A(i.area).name:'входящие'} · ${fd(i.date)}</span><button class="btn link" onclick="S.ideas=S.ideas.filter(x=>x.id!=='${i.id}');save();render()">×</button></div><p style="font:italic 400 19px/1.35 var(--serif);margin:8px 0">${esc(i.text)}</p><div class="row" style="gap:6px"><select aria-label="раздел" onchange="setIdeaArea('${i.id}',this.value)" style="width:auto;padding:4px 8px;font-size:12.5px"><option value="">разобрать в раздел…</option>${AREAS.map(a=>`<option value="${a.id}" ${i.area===a.id?'selected':''}>${a.name}</option>`).join('')}</select><button class="btn sm ghost" onclick="ideaToGoal('${i.id}')">сделать целью</button></div></div>`);
 return h+(list.length?'':'<p class="empty">Здесь пока тихо.</p>')+'</div>'}
function setIdeaArea(id,a){S.ideas.find(x=>x.id===id).area=a;save();render()}
function ideaToGoal(id){const i=S.ideas.find(x=>x.id===id);S.goals.push({id:uid(),area:i.area||'life',title:i.text,deadline:'',target:0,unit:'',progress:0,created:today(),done:false,steps:[]});S.ideas=S.ideas.filter(x=>x.id!==id);save();location.hash='goals';toast('Идея стала целью — поставь ей дедлайн')}

function weekStats(){const ws=weekStart();let checks=0;for(const d in S.checks)if(d>=ws)checks+=S.checks[d].length;
 return {checks,min:minutes(inWeek),words:S.lists.words.filter(w=>w.date>=ws).reduce((a,w)=>a+(+w.words||0),0),posts:S.lists.content.filter(c=>c.status==='опубликовано'&&c.date>=ws).length,ideas:S.ideas.filter(i=>i.date>=ws).length,steps:0}}
function pReview(){const w=weekStats();
 let h=`<div class="kicker">письмо себе в конце недели</div><h1>Обзор недели</h1><div class="grid g3">
 <div class="card"><div class="kicker">отметок привычек</div><div class="big">${w.checks}</div></div><div class="card"><div class="kicker">время</div><div class="big">${hm(w.min)}</div></div><div class="card"><div class="kicker">слов книги · постов · идей</div><div class="big">${w.words} · ${w.posts} · ${w.ideas}</div></div></div>
 <div class="card" style="margin-top:16px"><h2>Ответь себе честно</h2><form onsubmit="event.preventDefault();saveReview(this)">
 <label class="f">Чем я горжусь на этой неделе?</label><textarea name="wins"></textarea>
 <label class="f">Что мешало? Что я откладывала?</label><textarea name="obst"></textarea>
 <label class="f">Чему я научилась?</label><textarea name="learn"></textarea>
 <label class="f">Три цели на следующую неделю</label><textarea name="next"></textarea>
 <label class="f">Настроение недели</label><select name="mood"><option>спокойно</option><option>вдохновлённо</option><option>устала</option><option>тревожно</option><option>счастливо</option></select>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn">Запечатать письмо</button></div></form></div><h2 style="margin-top:28px">Архив писем</h2><div class="grid g2">`;
 [...S.reviews].reverse().forEach(r=>h+=`<div class="card blush"><div class="row between"><span class="kicker">неделя от ${fd(r.week)}</span><span class="chip">${esc(r.mood)}</span></div><p class="small muted">${r.stats.checks} отметок · ${hm(r.stats.min)} · ${r.stats.words} слов</p>${['wins','obst','learn','next'].filter(k=>r[k]).map(k=>`<p style="margin:6px 0"><b class="small">${{wins:'Горжусь',obst:'Мешало',learn:'Научилась',next:'Дальше'}[k]}:</b> ${esc(r[k]).replace(/\n/g,'<br>')}</p>`).join('')}<button class="btn link" onclick="if(confirm('Удалить запись?')){S.reviews=S.reviews.filter(x=>x.id!=='${r.id}');save();render()}">удалить</button></div>`);
 return h+(S.reviews.length?'':'<p class="empty">Первое письмо появится в воскресенье.</p>')+'</div>'}
function saveReview(f){const o={id:uid(),week:weekStart(),date:today(),stats:weekStats()};['wins','obst','learn','next','mood'].forEach(k=>o[k]=f[k].value.trim());S.reviews.push(o);save();render();toast('Письмо запечатано. +40')}

function pSeals(){const lv=level();let h=`<div class="kicker">каждое действие — сургучная печать</div><h1>Печати и уровни</h1>
 <div class="card wine"><div class="kicker">твой уровень</div><h2 style="font-style:italic;font-size:32px;margin:4px 0">${lv.name}</h2><div class="bar"><i style="width:${lv.pct}%"></i></div><p class="small" style="opacity:.8;margin:8px 0 0">${lv.p} очков${lv.next?' · следующий уровень «'+lv.next[0]+'» с '+lv.next[1]:''}</p></div>
 <p class="small muted">Очки: привычка +10 · 3 минуты работы +1 · шаг цели +10 · закрытая цель +100 · обзор недели +40 · 50 слов книги +1 · слово в словаре +3 · опубликованный пост +20 · пробный тест +15 · идея +2</p>
 <div class="grid g3" style="margin-top:12px">`;
 seals().forEach(([sym,n,d,on])=>h+=`<div class="card row" style="gap:14px;flex-wrap:nowrap"><div class="seal ${on?'':'off'}">${sym}</div><div><h3 style="font:500 18px/1.2 var(--serif)">${n}</h3><div class="small muted">${d}</div></div></div>`);
 return h+'</div>'}

function pArea(id){const a=A(id);const gs=S.goals.filter(g=>g.area===id);const wk=minutes(x=>x.area===id&&inWeek(x));
 let h=`<div class="kicker">раздел · ${hm(wk)} за неделю · ${hm(minutes(x=>x.area===id))} всего</div><h1>${a.name}</h1>`;
 h+=({asp:aAsp,art:aArt,eng:aEng,lt:aLt,ch:aCh,book:aBook}[id]||(()=>''))();
 h+=`<div class="row between" style="margin:26px 0 12px"><h2 style="margin:0">Цели раздела</h2><div class="row"><button class="btn sm ghost" onclick="addTime(null,'${id}')">+ время</button><button class="btn sm" onclick="editGoal(null,'${id}')">+ цель</button></div></div><div class="grid g2">${gs.map(g=>goalCard(g)).join('')||'<p class="empty">Целей пока нет.</p>'}</div>`;
 const ideas=S.ideas.filter(i=>i.area===id);if(ideas.length)h+=`<h2 style="margin-top:26px">Идеи раздела</h2><div class="card">${ideas.map(i=>`<p style="font:italic 18px/1.35 var(--serif);margin:6px 0">— ${esc(i.text)}</p>`).join('')}</div>`;
 return h}
function aAsp(){const c=S.lists.checklist,d=c.filter(x=>x.done).length;
 return `<div class="grid g3"><div class="card"><div class="kicker">чек-лист</div><div class="big">${d} / ${c.length}</div></div><div class="card"><div class="kicker">публикации и доклады</div><div class="big">${S.lists.articles.filter(a=>['отправлено','рецензия','принято'].includes(a.status)).length} · ${S.lists.conferences.filter(c=>['подано','принято','выступила'].includes(c.status)).length}</div><div class="small muted">для портфолио</div></div><div class="card"><div class="kicker">литература прочитано</div><div class="big">${S.lists.lit.filter(l=>['прочитано','законспектировано'].includes(l.status)).length}</div></div></div>
 <div style="margin-top:16px">${listBlock('checklist')}</div><div style="margin-top:16px">${listBlock('lit',{empty:'Добавь первую статью или книгу к теме диссертации.'})}</div>
 <div class="card" style="margin-top:16px"><h2>Набросок темы диссертации</h2><textarea aria-label="тема" onchange="S.settings.thesis=this.value;save()" placeholder="проблема · вопрос · метод · данные · чем полезно">${esc(S.settings.thesis||'')}</textarea></div>`}
function aArt(){const st=['идея','черновик','отправлено','рецензия','принято'];
 return `<div class="card"><div class="row between"><h2 style="margin:0">Воронка статей</h2><button class="btn sm" onclick="editItem('articles')">+ статья</button></div><div class="kan" style="margin-top:10px">${st.map(s=>`<div class="col"><div class="kicker">${s}</div>${S.lists.articles.filter(a=>a.status===s).map(a=>`<div class="it" onclick="editItem('articles','${a.id}')" style="cursor:pointer"><b>${esc(a.title)}</b><div class="small muted">${esc(a.venue)}</div>${a.deadline&&s!=='принято'?'<div style="margin-top:4px">'+dlChip(a.deadline)+'</div>':''}</div>`).join('')}</div>`).join('')}</div></div>
 <div style="margin-top:16px">${listBlock('conferences')}</div>`}
function aEng(){const v=S.lists.vocab;const i=window._fi||0;const card=v.length?v[i%v.length]:null;const show=window._fs;
 return `<div class="grid g2"><div class="card"><div class="kicker">словарь</div><div class="big">${v.length}</div><div class="small muted">слов и выражений</div></div><div class="card"><div class="kicker">английский за неделю</div><div class="big">${hm(minutes(x=>(x.area==='eng'||x.area==='lt')&&inWeek(x)))}</div><div class="small muted">вместе с подготовкой к Лингвотесту</div></div></div>
 <div class="card" style="margin-top:16px"><div class="row between"><h2 style="margin:0">Карточки</h2><span class="small muted">${v.length?(i%v.length+1)+' / '+v.length:''}</span></div>${card?`<div class="flash" onclick="window._fs=!window._fs;render()">${show?`<div><div>${esc(card.mean||'—')}</div><div class="small muted" style="font:13px var(--sans);margin-top:10px">${esc(card.ex||'')}</div></div>`:esc(card.word)}</div><div class="row" style="justify-content:center"><button class="btn sm ghost" onclick="window._fs=!window._fs;render()">${show?'скрыть':'показать значение'}</button><button class="btn sm" onclick="window._fi=Math.floor(Math.random()*${v.length});window._fs=false;render()">следующее</button></div>`:'<p class="empty">Добавь слова — и здесь появятся карточки для повторения.</p>'}</div>
 <div style="margin-top:16px">${listBlock('vocab')}</div>`}
function aLt(){const ed=S.settings.examDate;const d=ed?diffDays(today(),ed):null;const mk=[...S.lists.mocks].sort((a,b)=>a.date.localeCompare(b.date));
 const phase=d===null?'':d>75?'Этап 1 · диагностика и слабые места':d>21?'Этап 2 · тренировка блоков':d>=0?'Этап 3 · пробные тесты в формате экзамена':'Экзамен позади';
 return `<div class="letter"><div class="grid-bg">${LETTERS.repeat(4)}</div><div class="from">ССТ «Лингвотест» · академическая версия</div><div class="msg">${d===null?'Впиши дату сессии в настройках':d>=0?'До экзамена '+d+' дн.':'Экзамен был '+fd(ed)}</div><div class="from" style="margin:10px 0 0">${phase} · <a href="https://linguatest.hse.ru/schedule" target="_blank" rel="noopener" style="color:inherit">расписание сессий</a></div></div>
 <div style="margin-top:16px">${listBlock('ltblocks',{title:'Пять блоков: цель и текущий уровень'})}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Динамика пробных тестов</h2>${line(mk.map(m=>({l:m.date,v:+m.score})))}</div>${listBlock('ltweak',{empty:'Запиши, что даётся труднее всего — с этого начнём.'})}</div>
 <div style="margin-top:16px">${listBlock('mocks',{empty:'Сделай диагностический тест и запиши результат по каждому блоку.'})}</div>`}
function aCh(){const s=[...S.lists.chstats].sort((a,b)=>a.date.localeCompare(b.date));const last=s.at(-1);const pub=S.lists.content.filter(c=>c.status==='опубликовано');
 const wk=pub.filter(c=>c.date>=weekStart()).length;
 return `<div class="grid g3"><div class="card wine"><div class="kicker">вне сети · @dprincessclub</div><h2 style="font-style:italic;margin:6px 0 0">переписка, письма, книги</h2></div><div class="card"><div class="kicker">подписчики</div><div class="big">${last?last.followers:'—'}</div><div class="small muted">${last?'на '+fd(last.date):'добавь замер'}</div></div><div class="card"><div class="kicker">постов на этой неделе</div><div class="big">${wk}</div><div class="small ${wk?'':'muted'}">${wk?'ритм держится':'цель — хотя бы один'}</div></div></div>
 <div style="margin-top:16px">${listBlock('content',{empty:'Запланируй первый пост — даже идея уже шаг.'})}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Рост подписчиков</h2>${line(s.map(x=>({l:x.date,v:+x.followers})))}</div>${listBlock('chstats')}</div>`}
function aBook(){const total=bookWords(),goal=+S.settings.bookGoal||80000,t=today();const td=S.lists.words.filter(w=>w.date===t).reduce((a,w)=>a+(+w.words||0),0);const dw=+S.settings.dailyWords||300;
 const days=[...Array(14)].map((_,i)=>addDays(t,i-13));
 return `<div class="grid g3"><div class="card wine"><div class="kicker">роман, который ещё пишется</div><div class="big">${total.toLocaleString('ru-RU')}</div><div class="small" style="opacity:.8">из ${goal.toLocaleString('ru-RU')} слов</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,100*total/goal)}%"></i></div></div>
 <div class="card"><div class="kicker">сегодня</div><div class="big">${td}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,100*td/dw)}%"></i></div><div class="small muted" style="margin-top:4px">цель дня ${dw}</div><form class="row" style="margin-top:10px" onsubmit="event.preventDefault();addWords(this.n.value)"><input type="number" name="n" placeholder="слов" aria-label="слов написано" style="flex:1"><button class="btn sm">+</button></form></div>
 <div class="card"><div class="kicker">главы</div><div class="big">${S.lists.chapters.filter(c=>c.status==='готово').length} / ${S.lists.chapters.length}</div><div class="small muted">готово</div></div></div>
 <div class="card" style="margin-top:16px"><h2>Последние 14 дней</h2>${bars(days.map(d=>({l:String(new Date(d+'T12:00').getDate()),v:S.lists.words.filter(w=>w.date===d).reduce((a,w)=>a+(+w.words||0),0)})))}</div>
 <div class="tabs" style="margin-top:16px">${[['chapters','главы'],['characters','персонажи'],['world','мир и сюжет'],['phrases','фразы'],['words','журнал']].map(([k,n])=>`<button class="${(window._bt||'chapters')===k?'on':''}" onclick="window._bt='${k}';render()">${n}</button>`).join('')}</div>${listBlock(window._bt||'chapters')}`}
function addWords(n){n=+n;if(!n)return;S.lists.words.push({id:uid(),date:today(),words:n,note:''});save();render();toast('+'+n+' слов. Арина ждёт продолжения ✉')}

function pMore(){return `<h1>Ещё</h1><div class="grid g2">${[...AREAS.slice(0,6).map(a=>['area/'+a.id,a.name]),['ideas','Идеи'],['review','Обзор недели'],['seals','Печати и уровни'],['settings','Настройки']].map(([h,n])=>`<a href="#${h}" class="card" style="text-decoration:none;font:500 20px var(--serif)">${n}</a>`).join('')}</div>`}

function pSettings(){const s=S.settings;
 return `<h1>Настройки</h1><div class="grid g2"><div class="card"><form onsubmit="event.preventDefault();saveSettings(this)">
 <label class="f">Как к тебе обращаться</label><input type="text" name="name" value="${esc(s.name)}">
 <label class="f">Твоё «зачем» — письмо на главной</label><textarea name="why">${esc(s.why)}</textarea>
 <label class="f">Дата сессии Лингвотеста</label><input type="date" name="examDate" value="${esc(s.examDate)}">
 <label class="f">Цель по объёму романа (слов)</label><input type="number" name="bookGoal" value="${esc(s.bookGoal)}">
 <label class="f">Цель слов в день</label><input type="number" name="dailyWords" value="${esc(s.dailyWords)}">
 <label class="f">Тема</label><select name="theme">${[['auto','как в системе'],['light','светлая'],['dark','тёмная']].map(([v,n])=>`<option value="${v}" ${s.theme===v?'selected':''}>${n}</option>`).join('')}</select>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn">Сохранить</button></div></form></div>
 <div class="card"><h2>Резервная копия</h2><p class="small muted">Все данные хранятся только в этом браузере на этом устройстве. Скачивай копию раз в неделю — её можно загрузить обратно или на другом устройстве.</p><p class="small">Последняя копия: ${s.lastBackup?fd(s.lastBackup):'ещё не было'}</p>
 <div class="row"><button class="btn" onclick="exportData()">Скачать копию (.json)</button><label class="btn ghost" style="cursor:pointer">Загрузить копию<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div>
 <h2 style="margin-top:24px">Начать заново</h2><p class="small muted">Удалит все записи и вернёт стартовые примеры.</p><button class="btn ghost" style="color:var(--late);border-color:var(--late)" onclick="if(confirm('Точно удалить все данные? Сначала лучше скачать копию.')){S=seed();save();applyTheme();render()}">Сбросить всё</button></div></div>`}
function saveSettings(f){['name','why','examDate','theme'].forEach(k=>S.settings[k]=f[k].value);S.settings.bookGoal=+f.bookGoal.value||80000;S.settings.dailyWords=+f.dailyWords.value||300;save();applyTheme();render();toast('Сохранено')}
function exportData(){S.settings.lastBackup=today();save();const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vne-seti-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render()}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.goals||!d.lists)throw 0;if(!confirm('Заменить текущие данные данными из файла?'))return;S=d;load.call&&0;const base=seed();for(const k in base)if(S[k]===undefined)S[k]=base[k];save();applyTheme();render();toast('Копия загружена')}catch(e){alert('Не получилось прочитать файл копии.')}};r.readAsText(file)}

/* ============ toast ============ */
function toast(msg){const el=document.createElement('div');el.className='notif';el.setAttribute('role','status');el.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;box-shadow:var(--shadow);max-width:90vw';el.innerHTML=`<div class="ic">✉</div><div><div class="t">вне сети</div><div class="s">${esc(msg)}</div></div><span class="when">сейчас</span>`;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}

render();
</script>
</body>
</html>
